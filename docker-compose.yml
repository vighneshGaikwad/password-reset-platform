version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: sspr-postgres
    environment:
      POSTGRES_DB: sspr_db
      POSTGRES_USER: sspr_user
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: