---
- name: SSPR Platform Health Check
  hosts: all
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Check PostgreSQL is running
      service_facts:
      register: services_state

    - name: Verify PostgreSQL service
      assert:
        that: ansible_facts.services['postgresql.service'].state == 'running'
        fail_msg: "PostgreSQL is NOT running!"
        success_msg: "PostgreSQL is running"
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Check backend health endpoint
      uri:
        url: "http://localhost:{{ backend_port }}/api/v1/admin/dashboard/summary"
        method: GET
        return_content: yes
        status_code: 200
      register: health_result
      ignore_errors: yes

    - name: Display health check result
      debug:
        msg: "Backend Health: {{ 'HEALTHY' if health_result.status == 200 else 'UNHEALTHY' }}"
      when: health_result is defined

    - name: Check Docker containers
      command: docker ps --format '{{ '{{' }}.Names{{ '}}' }} - {{ '{{' }}.Status{{ '}}' }}'
      register: docker_status
      ignore_errors: yes

    - name: Display Docker container status
      debug:
        var: docker_status.stdout_lines
      when: docker_status is defined

    - name: Check listening ports
      command: ss -tlnp
      register: ports_status

    - name: Display listening ports
      debug:
        var: ports_status.stdout_lines

    - name: Check disk usage
      command: df -h /
      register: disk_usage

    - name: Display disk usage
      debug:
        var: disk_usage.stdout_lines

    - name: Check memory usage
      command: free -m
      register: memory_usage
      when: ansible_os_family == "Debian"

    - name: Display memory usage
      debug:
        var: memory_usage.stdout_lines
      when: ansible_os_family == "Debian"

    - name: Health Check Summary
      debug:
        msg: |
          ============================================
          SSPR Platform Health Check Summary
          ============================================
          Backend API: {{ 'PASS' if health_result.status is defined and health_result.status == 200 else 'FAIL' }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ============================================
